    <!-- Scripts (mesma lógica de animação e globo) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Animações de revelação
            const revealElements = document.querySelectorAll('.reveal');
            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.12,
                rootMargin: '0px 0px -40px 0px'
            });

            revealElements.forEach(el => revealObserver.observe(el));

            // 2. Rotação sutil do globo ao scroll (mesma lógica)
            const globeBg = document.getElementById('antique-globe-bg');
            let ticking = false;

            window.addEventListener('scroll', () => {
                if (!ticking && globeBg) {
                    window.requestAnimationFrame(() => {
                        const scrollY = window.scrollY;
                        const rotation = scrollY * 0.025;
                        const translateY = scrollY * 0.06;
                        globeBg.style.transform = `translateY(${translateY}px) rotate(${rotation}deg)`;
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });

            // 3. Forçar visibilidade imediata do container principal (evita atraso no 404)
            // O observer já fará isso, mas garantimos que o bloco principal apareça mesmo sem scroll.
            const mainReveal = document.querySelector('.error-container.reveal');
            if (mainReveal) {
                setTimeout(() => {
                    mainReveal.classList.add('is-visible');
                }, 60);
            }
        });
    </script>
